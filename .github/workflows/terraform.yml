name: Terraform checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_project_name: ${{ vars.TF_PROJECT_NAME }}
      TF_VAR_alb_name: ${{ vars.TF_ALB_NAME }}
      TF_VAR_ecr_repository_name: ${{ vars.TF_ECR_REPOSITORY_NAME }}
      TF_VAR_rds_db_name: ${{ vars.TF_RDS_DB_NAME }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_aws_region: us-east-1
      TF_VAR_aws_account_id: ${{ vars.TF_AWS_ACCOUNT_ID }}
      TF_VAR_ec2_key_name: ${{ vars.TF_EC2_KEY_NAME }}
      TF_VAR_ssh_allowed_cidr: ${{ vars.TF_SSH_ALLOWED_CIDR }}
      TF_VAR_rds_db_password: ${{ secrets.TF_RDS_DB_PASSWORD }}

    defaults:
      run:
        working-directory: infra
  
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
  
      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-${{ github.run_id }}
  
      - name: Confirm AWS identity
        run: aws sts get-caller-identity
  
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"
  
      - name: Initialize Terraform
        run: terraform init -input=false
  
      - name: Check Terraform formatting
        run: terraform fmt -check
  
      - name: Validate Terraform configuration
        run: terraform validate
  
      - name: Create Terraform plan
        run: terraform plan -input=false

      - name: Apply Terraform
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve -input=false

  publish:
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY_NAME: ${{ vars.TF_ECR_REPOSITORY_NAME }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-ecr-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE_TAG: ${{ github.sha }}
          IMAGE_URI: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY_NAME }}
        run: |
          docker build \
            --tag "$IMAGE_URI:$IMAGE_TAG" \
            --tag "$IMAGE_URI:latest" \
            .

          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      AWS_REGION: us-east-1
      PROJECT_NAME: ${{ vars.TF_PROJECT_NAME }}
      ECR_REPOSITORY_NAME: ${{ vars.TF_ECR_REPOSITORY_NAME }}
      RDS_DB_NAME: ${{ vars.TF_RDS_DB_NAME }}
      RDS_DB_PASSWORD: ${{ secrets.TF_RDS_DB_PASSWORD }}
      SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
      APP_PORT: 4000

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-actions-deploy-${{ github.run_id }}

      - name: Deploy container to EC2
        run: |
          set -euo pipefail

          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters \
              "Name=tag:Name,Values=${PROJECT_NAME}-app-instance" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          RDS_HOST=$(aws rds describe-db-instances \
            --region "$AWS_REGION" \
            --db-instance-identifier "${PROJECT_NAME}-db" \
            --query 'DBInstances[0].Endpoint.Address' \
            --output text)

          IMAGE_URI=$(aws ecr describe-repositories \
            --region "$AWS_REGION" \
            --repository-names "$ECR_REPOSITORY_NAME" \
            --query 'repositories[0].repositoryUri' \
            --output text)

          RDS_DB_PASSWORD_ENCODED=$(printf '%s' "$RDS_DB_PASSWORD" | jq -sRr @uri)
          DATABASE_URL="ecto://postgres:${RDS_DB_PASSWORD_ENCODED}@${RDS_HOST}:5432/${RDS_DB_NAME}"

          COMMAND=$(cat <<EOF
          aws ecr get-login-password --region ${AWS_REGION} |
            docker login --username AWS --password-stdin ${IMAGE_URI%%/*}

          docker system prune --all --force

          docker pull ${IMAGE_URI}:${GITHUB_SHA}

          docker rm --force order-of-the-phoenix || true

          docker run --detach \
            --name order-of-the-phoenix \
            --restart unless-stopped \
            --log-driver awslogs \
            --log-opt awslogs-region="${AWS_REGION}" \
            --log-opt awslogs-group="/${PROJECT_NAME}/app-logs" \
            --publish "${APP_PORT}:${APP_PORT}" \
            --env DATABASE_URL='${DATABASE_URL}' \
            --env PORT="${APP_PORT}" \
            --env SECRET_KEY_BASE='${SECRET_KEY_BASE}' \
            --env PHX_SERVER=true \
            ${IMAGE_URI}:${GITHUB_SHA}
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$(jq -n --arg command "$COMMAND" '{commands: [$command]}')" \
            --query 'Command.CommandId' \
            --output text)

          aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

  test:
    needs: deploy
    runs-on: ubuntu-latest

    env:
      APP_URL: "http://order-of-the-phoenix-alb-130819812.us-east-1.elb.amazonaws.com"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Check deployed app
        run: |
          STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            --retry 12 --retry-delay 5 "$APP_URL")
          test "$STATUS" = "200"

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "29.0.3"

      - name: Run tests
        run: |
          mix deps.get
          mix test

  vulnerability-scan:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Scan dependencies
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
