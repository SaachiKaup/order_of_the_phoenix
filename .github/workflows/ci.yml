name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: order_of_the_phoenix_dev
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t order-of-the-phoenix:ci .

      - name: Run app container
        run: |
          docker run -d --name order-of-the-phoenix-ci \
            --network host \
            -e DATABASE_URL=ecto://postgres:postgres@127.0.0.1:5432/order_of_the_phoenix_dev \
            -e SECRET_KEY_BASE=0123456789012345678901234567890123456789012345678901234567890123 \
            -e PHX_SERVER=true \
            -e PORT=4000 \
            order-of-the-phoenix:ci

      - name: Wait for app
        run: sleep 20

      - name: Check homepage
        run: curl --fail http://127.0.0.1:4000

      - name: Show container logs on failure
        if: failure()
        run: docker logs order-of-the-phoenix-ci
